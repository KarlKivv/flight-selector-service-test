		/>
	</head>
	<body>
		<div class="outer-container">
			<h1>Flight info</h1>
			<div class="search-container">

						All flights for today and tomorrow
					</button>

				<br />
				<form
					class="datetime-selector"
					th:action="@{/}"
					method="get"
					th:object="${flightsDTO}"
				>
					<span>Choose a time for flight:</span>
					<label>
						<span>Start from:</span>

						<!-- <input
								type="datetime-local"
								id="dateTimeFilterStart"
								name="dateTimeFilterStart"
								th:attr="min=${#calendars.format(flightsDTO.dateTimeFilterStart(), 'yyyy-MM-dd''T''HH:mm')}"
								th:value="${#calendars.format(flightsDTO.dateTimeFilterStart(), 'yyyy-MM-dd''T''HH:mm')}"
							/> -->
						<input
							type="datetime-local"
							id="dateTimeFilterStart"
							name="dateTimeFilterStart"
							th:value="${#calendars.format(flightsDTO.dateTimeFilterStart(), 'yyyy-MM-dd''T''HH:mm')}"
						/>
					</label>
					<label>
						<span>End at:</span>
						<input
							type="datetime-local"
							id="dateTimeFilterEnd"
							name="dateTimeFilterEnd"
							th:value="${#calendars.format(flightsDTO.dateTimeFilterEnd(), 'yyyy-MM-dd''T''HH:mm')}"
						/>
					</label>
					<label>
						<span>Destination:</span>
						<input
							type="text"
							name="destinationFilter"
							id="destinationFilter"
							class="destinationFilter"
							placeholder="Filter by destination..."
							th:field="*{destinationFilter}"
						/>
					</label>
					<button type="submit">Search for flights</button>
					<button
						type="submit"
						name="default"
					>
						All flights for today and tomorrow
					</button>
				</form>
			</div>
			<hr />
			<div class="flights-container">
				<div
					class="cards-container"
					th:with="now=${#calendars.createNow()}"
					th:each="card : ${flightsDTO.flights()}"
				>
					<a
						href="#"
						th:href="@{/flight(id=${card.id})}"
					>
						<div class="card">
							<div>
								<p
									class="card-timestamp"
									th:text="|${card.getDepartureTime()} ${card.getDepartureDateString()}|"
								>
									00:00
								</p>
							</div>
							<div class="card-info">
								<div>
									<h3
										th:text="${card.destination.getDestinationString()}"
									>
										destination
									</h3>
									<div class="flight-info">
										<p th:text="${card.getFlightCode()}">
											flight code
										</p>
										<p th:text="${card.getAirline()}">
											company not specified
										</p>
									</div>
								</div>
							</div>
							<div>
								<p
									th:if="${now.after(card.getDepartureDate())}"
								>
									This flight has already departed
								</p>
							</div>
						</div>
					</a>
				</div>
			</div>
		</div>
	</body>
